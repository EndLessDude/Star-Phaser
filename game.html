<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Making your first Phaser 3 Game - Part 10</title>
    <script src="js/phaser.min.js"></script>
    <style type="text/css">
        body {
            margin: 0;
        }
    </style>
</head>

<body>

    <script type="text/javascript">

        // Welcome

       // create.rect(0, 0, 1200, 600, 0x87CEEB).setOrigin(0, 0);




        //


        var config = {
            type: Phaser.AUTO,
            width: 1200,
            height: 600,
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        var player;
        var stars;
        var bombs;
        var platforms;
        var cursors;
        var score = 0;
        var gameOver = false;
        var scoreText;
        var bonusStar;
        var game = new Phaser.Game(config);

        function preload() {
            this.load.image('sky', 'assets/sky.png');
            this.load.image('ground', 'assets/platform.png');
            this.load.image('star', 'assets/star.png');
            this.load.image('bonusStar', 'assets/bonusStar.png');
            this.load.image('bomb', 'assets/bomb.png');
            this.load.spritesheet('dude', 'assets/dude.png', { frameWidth: 32, frameHeight: 48 });
        }

        function create() {
            //  A simple background for our game
            this.add.image(400, 300, 'sky');
            this.add.image(700, 300, 'sky'); // +300
            this.add.image(800, 300, 'sky');

            //  The platforms group contains the ground and the 2 ledges we can jump on
            platforms = this.physics.add.staticGroup();

            //  Here we create the ground.
            //  Scale it to fit the width of the game (the original sprite is 400x32 in size)
            platforms.create(400, 568, 'ground').setScale(2).refreshBody();
            platforms.create(800, 568, 'ground').setScale(2).refreshBody();

            //  Now let's create some ledges
            platforms.create(620, 400, 'ground');
            platforms.create(120, 250, 'ground');
            platforms.create(950, 220, 'ground');

            // The player and its settings
            player = this.physics.add.sprite(100, 450, 'dude');

            //  Player physics properties. Give the little guy a slight bounce.
            player.setBounce(0.05);
            player.setCollideWorldBounds(true);

            keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
            keyW = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W);
            keyD = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);

            //  Our player animations, turning, walking left and walking right.
            this.anims.create({
                key: 'left',
                frames: this.anims.generateFrameNumbers('dude', { start: 0, end: 3 }),
                frameRate: 10,
                repeat: -1
            });

            this.anims.create({
                key: 'turn',
                frames: [{ key: 'dude', frame: 4 }],
                frameRate: 20
            });

            this.anims.create({
                key: 'right',
                frames: this.anims.generateFrameNumbers('dude', { start: 5, end: 8 }),
                frameRate: 10,
                repeat: -1
            });

            //  Input Events
            cursors = this.input.keyboard.createCursorKeys();

            //  Some stars to collect, 12 in total, evenly spaced 70 pixels apart along the x axis
            stars = this.physics.add.group({
                key: 'star',
                repeat: 11,
                setXY: { x: 12, y: 0, stepX: 70 }


            });

            /*
            bonusStar = this.physics.add.group({
                key: 'star',
                repeat: 1,
                setXY: { x: 400, y: 150, stepX: 70 }


            });

            bonusStar.children.iterate(function (child) {
                child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));
            })
            */
            stars.children.iterate(function (child) {


                //  Give each star a slightly different bounce
                child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));

            });

            bombs = this.physics.add.group();
            bonusStar = this.physics.add.group();
            //   bonusStar.create(400, 140, 'bonusStar').setScale(2).refreshBody();
            var bStar = bonusStar.create(400, 150, 'bonusStar').setScale(2).refreshBody();;
            bStar.setBounce(1);
            bStar.setCollideWorldBounds(true);
            bStar.setVelocity(Phaser.Math.Between(-40, 200));
            bStar.allowGravity = false;

            /*
                 bonusStar = this.physics.add.group({ // creates a new object for Magic Star
                    key: 'bonusStar', // name of the assett
                    setXY: { x: 400, y: 150,} // coordinates of the magic star
                });
                */

            //  The score
            scoreText = this.add.text(16, 16, 'score: 0', { fontSize: '32px', fill: '#000' });

            //  Collide the player and the stars with the platforms
            this.physics.add.collider(player, platforms);
            this.physics.add.collider(stars, platforms);
            this.physics.add.collider(bombs, platforms);

            //  Checks to see if the player overlaps with any of the stars, if he does call the collectStar function
            this.physics.add.overlap(player, stars, collectStar, null, this);
            this.physics.add.collider(bonusStar, platforms);
            this.physics.add.collider(player, bonusStar, collectBonusStar, null, this);
            this.physics.add.collider(bombs, bonusStar);
            this.physics.add.collider(player, bombs, hitBomb, null, this);
        }

        function update() {
            if (gameOver == true){
            alert("You Lose");
            document.location.reload();
        }
        if (score == 660){
            alert("You Win");
            document.location.reload();
        }
            if (keyA.isDown) {
                player.setVelocityX(-160); //160 pixels left
                player.anims.play('left', true);
            }
            //to go right
            else if (keyD.isDown) {
                player.setVelocityX(160); //160 pixels right
                player.anims.play('right', true);
            }
            //to stand still
            else {
                player.setVelocityX(0); //o velocity = no mvoement
                player.anims.play('turn');
            }
            //to go up
            if (keyW.isDown && player.body.touching.down) {
                player.setVelocityY(-350); //330 pixels up, it's in inverse
            }
        }

        function collectStar(player, star) {
            star.disableBody(true, true);

            //  Add and update the score
            score += 10;
            scoreText.setText('Score: ' + score);
            if (stars.countActive(true) === 0 && bonusStar.countActive(true) === 0) {
                //  A new batch of stars to collect
                stars.children.iterate(function (child) {

                    child.enableBody(true, child.x, 0, true, true);

                });

                bonusStar.children.iterate(function (child) {
                child.enableBody(true, child.x, 0, true, true)
            })

                var x = (player.x < 400) ? Phaser.Math.Between(400, 800) : Phaser.Math.Between(0, 400);

                var bomb = bombs.create(x, 16, 'bomb');
                bomb.setBounce(1);
                bomb.setCollideWorldBounds(true);
                bomb.setVelocity(Phaser.Math.Between(-400, 200), 20);
                bomb.allowGravity = false;

            }

        }


        function collectBonusStar(player, bonusStar) {
            bonusStar.disableBody(true, true);

            score += 100;
            scoreText.setText('Score: ' + score);
            if (stars.countActive(true) === 0){
                //  A new batch of stars to collect
                stars.children.iterate(function (child) {

                    child.enableBody(true, child.x, 0, true, true);

                });
                bonusStar.children.iterate(function (child) {

                child.enableBody(true, child.x, 0, true, true);
            })
            }
        }

        function hitBomb(player, bomb) {
            this.physics.pause();

            player.setTint(0xff0000);

            player.anims.play('turn');

            gameOver = true;
        }





    </script>

</body>

</html>
