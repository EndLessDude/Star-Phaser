
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Phaser 3 Platformer</title>
    <script src="js/phaser.min.js"></script>

    <style>
        body {
            margin: 0;
        }
    </style>
</head>

<body>

<script>

var WIDTH = 1200;
var HEIGHT = 600;
var WIN_SCORE = 660;

var player;
var stars;
var bombs;
var platforms;
var cursors;
var keyA, keyW, keyD;
var score = 0;
var gameOver = false;
var scoreText;
var bonusStar;

function makeButton(scene, x, y, w, h, label, fillColor, textColor, onClick, fontSize = 56) {

    var btn = scene.add.rectangle(x, y, w, h, fillColor)
        .setStrokeStyle(6, 0x000000, 0.35)
        .setInteractive({ useHandCursor: true });

    var txt = scene.add.text(x, y, label, {
        fontFamily: 'Arial',
        fontSize: fontSize + 'px',
        fontStyle: 'bold',
        color: textColor
    }).setOrigin(0.5);

    btn.on('pointerover', function () {
        btn.setScale(1.06);
        txt.setScale(1.06);
    });

    btn.on('pointerout', function () {
        btn.setScale(1);
        txt.setScale(1);
    });

    btn.on('pointerdown', onClick);

    return btn;
}

class MenuScene extends Phaser.Scene {

    constructor() {
        super('Menu');
    }

    preload() {
        this.load.image('star', 'assets/star.png');
        this.load.image('bomb', 'assets/bomb.png');
    }

    create() {

        this.cameras.main.setBackgroundColor('#87CEEB');

        this.hangDecoration(300, 'star', 3, 110);
        this.hangDecoration(900, 'bomb', 3, 150);

        this.add.text(WIDTH / 2, 150, 'STAR COLLECTOR', {
            fontFamily: 'Arial',
            fontSize: '72px',
            fontStyle: 'bold',
            color: '#ffffff',
            stroke: '#1a5c8a',
            strokeThickness: 10
        }).setOrigin(0.5);

        makeButton(this, WIDTH / 2, 340, 360, 110,
            'PLAY', 0x2ecc40, '#ffffff', () => {
                this.scene.start('Game');
            });

        makeButton(this, WIDTH / 2, 490, 280, 85,
            'RULES', 0xffffff, '#1a5c8a', () => {
                this.scene.start('Rules');
            }, 42);
    }

    hangDecoration(x, key, scale, ropeLength) {

        var holder = this.add.container(x, 0);

        var rope = this.add.rectangle(
            0, 0, 4, ropeLength, 0x5a3a1a
        ).setOrigin(0.5, 0);

        var img = this.add.image(0, ropeLength, key).setScale(scale);

        img.y = ropeLength + (img.displayHeight / 2);

        holder.add([rope, img]);

        holder.angle = -6;

        this.tweens.add({
            targets: holder,
            angle: 6,
            duration: 1400,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });
    }
}

class RulesScene extends Phaser.Scene {

    constructor() {
        super('Rules');
    }

    create() {

        this.cameras.main.setBackgroundColor('#87CEEB');

        this.add.rectangle(
            WIDTH / 2, HEIGHT / 2, 900, 440, 0xffffff, 0.95
        ).setStrokeStyle(8, 0x1a5c8a);

        this.add.text(WIDTH / 2, 125, 'GAME RULES', {
            fontFamily: 'Arial',
            fontSize: '65px',
            fontStyle: 'bold',
            color: '#1a5c8a'
        }).setOrigin(0.5);

        var rulesText =
            '  Collect all stars in all 3 levels to win the game\n\n' +
            '  Avoid the bombs\n\n' +
            '  Yellow stars give 10 points\n\n' +
            '  Red stars give 50 points';

        this.add.text(220, 205, rulesText, {
            fontFamily: 'Arial',
            fontSize: '29px',
            color: '#222222',
            lineSpacing: 10,
            wordWrap: { width: 760 }
        });

        makeButton(this, WIDTH / 2, 510, 240, 75,
            'BACK', 0x2ecc40, '#ffffff', () => {
                this.scene.start('Menu');
            }, 38);
    }
}

class GameScene extends Phaser.Scene {

    constructor() {
        super('Game');
    }

    preload() {

        this.load.image('sky', 'assets/sky.png');
        this.load.image('ground', 'assets/platform.png');
        this.load.image('star', 'assets/star.png');
        this.load.image('bonusStar', 'assets/bonusStar.png');
        this.load.image('bomb', 'assets/bomb.png');

        this.load.spritesheet('dude', 'assets/dude.png', {
            frameWidth: 32,
            frameHeight: 48
        });
    }

    create() {

        score = 0;
        gameOver = false;

        this.cameras.main.setBackgroundColor('#000000');

        this.add.image(400, 300, 'sky');
        this.add.image(700, 300, 'sky');
        this.add.image(800, 300, 'sky');

        platforms = this.physics.add.staticGroup();

        platforms.create(400, 568, 'ground').setScale(2).refreshBody();
        platforms.create(800, 568, 'ground').setScale(2).refreshBody();

        platforms.create(620, 400, 'ground');
        platforms.create(120, 250, 'ground');
        platforms.create(950, 220, 'ground');

        player = this.physics.add.sprite(100, 450, 'dude');

        player.setBounce(0.05);
        player.setCollideWorldBounds(true);

        keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
        keyW = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W);
        keyD = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);

        cursors = this.input.keyboard.createCursorKeys();

        if (!this.anims.exists('left')) {

            this.anims.create({
                key: 'left',
                frames: this.anims.generateFrameNumbers('dude', {
                    start: 0,
                    end: 3
                }),
                frameRate: 10,
                repeat: -1
            });

            this.anims.create({
                key: 'turn',
                frames: [{ key: 'dude', frame: 4 }],
                frameRate: 20
            });

            this.anims.create({
                key: 'right',
                frames: this.anims.generateFrameNumbers('dude', {
                    start: 5,
                    end: 8
                }),
                frameRate: 10,
                repeat: -1
            });
        }

        stars = this.physics.add.group({
            key: 'star',
            repeat: 11,
            setXY: {
                x: 12,
                y: 0,
                stepX: 70
            }
        });

        stars.children.iterate(function (child) {
            child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));
        });

        bombs = this.physics.add.group();

        bonusStar = this.physics.add.group();

        var bStar = bonusStar.create(400, 150, 'bonusStar')
            .setScale(2)
            .refreshBody();

        bStar.setBounce(1);
        bStar.setCollideWorldBounds(true);
        bStar.body.allowGravity = false;
        bStar.setVelocity(Phaser.Math.Between(0, 1) ? 150 : -150, 0);

        scoreText = this.add.text(16, 16, 'Score: 0', {
            fontSize: '32px',
            fill: '#000'
        });

        this.physics.add.collider(player, platforms);
        this.physics.add.collider(stars, platforms);
        this.physics.add.collider(bombs, platforms);

        this.physics.add.overlap(
            player, stars, this.collectStar, null, this
        );

        this.physics.add.collider(bonusStar, platforms);

        this.physics.add.collider(
            player, bonusStar, this.collectBonusStar, null, this
        );

        this.physics.add.collider(bombs, bonusStar);

        this.physics.add.collider(
            player, bombs, this.hitBomb, null, this
        );
    }

    update() {

        if (gameOver) return;

        if (score >= WIN_SCORE) {
            gameOver = true;
            this.scene.start('Win');
            return;
        }

        if (keyA.isDown || cursors.left.isDown) {

            player.setVelocityX(-160);
            player.anims.play('left', true);
        }

        else if (keyD.isDown || cursors.right.isDown) {

            player.setVelocityX(160);
            player.anims.play('right', true);
        }

        else {

            player.setVelocityX(0);
            player.anims.play('turn');
        }

        if ((keyW.isDown || cursors.up.isDown) &&
            player.body.touching.down) {

            player.setVelocityY(-350);
        }
    }

    collectStar(player, star) {

        if (gameOver) return;

        star.disableBody(true, true);

        score += 10;
        scoreText.setText('Score: ' + score);

        if (score >= WIN_SCORE) {
            gameOver = true;
            this.scene.start('Win');
            return;
        }

        if (stars.countActive(true) === 0 &&
            bonusStar.countActive(true) === 0) {

            this.respawnCollectibles(player);
        }
    }

    collectBonusStar(player, bStar) {

        if (gameOver) return;

        bStar.disableBody(true, true);

        score += 50;
        scoreText.setText('Score: ' + score);

        if (score >= WIN_SCORE) {
            gameOver = true;
            this.scene.start('Win');
            return;
        }

        if (stars.countActive(true) === 0) {
            this.respawnCollectibles(player);
        }
    }

    respawnCollectibles(player) {

        stars.children.iterate(function (child) {
            child.enableBody(true, child.x, 0, true, true);
        });

        bonusStar.children.iterate(function (child) {
            child.enableBody(true, child.x, 150, true, true);

            child.body.allowGravity = false;

            child.setVelocity(
                Phaser.Math.Between(0, 1) ? 150 : -150,
                0
            );
        });

        var x = (player.x < 600)
            ? Phaser.Math.Between(600, 1100)
            : Phaser.Math.Between(100, 600);

        var bomb = bombs.create(x, 16, 'bomb');

        bomb.setScale(2);

        bomb.setBounce(1);
        bomb.setCollideWorldBounds(true);
        bomb.setVelocity(Phaser.Math.Between(-400, 200), 20);
        bomb.body.allowGravity = false;
    }

    hitBomb(player, bomb) {

        if (gameOver) return;

        gameOver = true;

        this.physics.pause();

        player.setTint(0xff0000);
        player.anims.play('turn');

        this.time.delayedCall(350, () => {
            this.scene.start('GameOver');
        });
    }
}

class GameOverScene extends Phaser.Scene {

    constructor() {
        super('GameOver');
    }

    create() {

        this.cameras.main.setBackgroundColor('#0a0a0a');

        this.add.text(WIDTH / 2, 130, 'You Lose!', {
            fontFamily: 'Arial',
            fontSize: '120px',
            fontStyle: 'bold',
            color: '#e00000'
        }).setOrigin(0.5);

        this.add.text(WIDTH / 2, 280, '\u2639', {
            fontFamily: 'Arial',
            fontSize: '150px',
            color: '#e00000'
        }).setOrigin(0.5);

        makeButton(this, WIDTH / 2, 470, 320, 110,
            'RETRY', 0xffffff, '#000000', () => {
                this.scene.start('Game');
            });
    }
}

class WinScene extends Phaser.Scene {

    constructor() {
        super('Win');
    }

    create() {

        this.cameras.main.setBackgroundColor('#2ecc40');

        this.add.text(WIDTH / 2, 130, 'You Win!', {
            fontFamily: 'Arial',
            fontSize: '120px',
            fontStyle: 'bold',
            color: '#ffffff'
        }).setOrigin(0.5);

        this.add.text(WIDTH / 2, 280, '\u263B', {
            fontFamily: 'Arial',
            fontSize: '150px',
            color: '#ffffff'
        }).setOrigin(0.5);

        makeButton(this, WIDTH / 2, 470, 320, 110,
            'RETRY', 0xffffff, '#1a7a24', () => {
                this.scene.start('Game');
            });
    }
}

var config = {

    type: Phaser.AUTO,

    width: WIDTH,
    height: HEIGHT,

    physics: {
        default: 'arcade',

        arcade: {
            gravity: { y: 300 },
            debug: false
        }
    },

    scene: [
        MenuScene,
        RulesScene,
        GameScene,
        GameOverScene,
        WinScene
    ]
};

var game = new Phaser.Game(config);

</script>

</body>
</html>
